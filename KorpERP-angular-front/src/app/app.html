<mat-toolbar class="app-toolbar">
    <button matIconButton type="button" aria-label="Abrir ou fechar menu de navegacao" (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
    </button>

    <span class="app-name">KorpERP</span>
    <span class="toolbar-spacer"></span>

    <button matIconButton type="button" aria-label="Conta do usuario">
        <mat-icon>account_circle</mat-icon>
    </button>
</mat-toolbar>

<mat-sidenav-container class="app-container">
    <mat-sidenav #drawer class="app-sidenav" [mode]="isHandset() ? 'over' : 'side'" [opened]="!isHandset()">
        <div class="nav-heading">Navegacao</div>
        <mat-nav-list>
            <a mat-list-item routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
                (click)="isHandset() && drawer.close()">
                <mat-icon matListItemIcon>home</mat-icon>
                <span matListItemTitle>Inicio</span>
            </a>
            <a mat-list-item routerLink="/produtos" routerLinkActive="active-link"
                (click)="isHandset() && drawer.close()">
                <mat-icon matListItemIcon>inventory_2</mat-icon>
                <span matListItemTitle>Produtos</span>
            </a>
            <a mat-list-item routerLink="/notas" routerLinkActive="active-link" (click)="isHandset() && drawer.close()">
                <mat-icon matListItemIcon>receipt_long</mat-icon>
                <span matListItemTitle>Notas fiscais</span>
            </a>
        </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="app-content">
        <router-outlet />
    </mat-sidenav-content>
</mat-sidenav-container>
