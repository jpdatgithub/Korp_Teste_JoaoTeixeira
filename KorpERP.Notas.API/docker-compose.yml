services:
  notas-db:
    image: postgres:16
    environment:
      POSTGRES_DB: korperp_notas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5435:5432"
    volumes:
      - notas-data:/var/lib/postgresql/data

volumes:
  notas-data:
    name: korperp_notas_data
